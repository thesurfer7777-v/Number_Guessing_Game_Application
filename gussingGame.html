<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-card">
        <h1>Number Guessing Game</h1>
        <p class="subtitle">Guess a number between 1 and 10</p>
        
        <div id="message" class="message">Attempt 1 of 3: Make your guess!</div>
        
        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="10" placeholder="Enter number">
            <button id="submitBtn">Guess</button>
        </div>
        
        <div class="stats">
            <span>Attempts: <strong id="attemptCount">0</strong>/3</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
